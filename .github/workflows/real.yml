name: Build GameVPN Real
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: mine
      - uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          submodules: recursive
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download core library
        run: |
          mkdir -p src/V2rayNG/app/libs
          gh release download -R 2dust/AndroidLibXrayLite -p "libv2ray.aar" -D src/V2rayNG/app/libs
      - name: Rebrand
        run: |
          command -v convert >/dev/null || sudo apt-get install -y -qq imagemagick
          R=src/V2rayNG/app/src/main/res
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">GameVPN</string>|' $R/values/strings.xml
          for f in $R/values-*/strings.xml; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">GameVPN</string>|' "$f"
          done
          ICON=$(ls mine/*.png 2>/dev/null | head -1)
          if [ -n "$ICON" ]; then
            for f in $(find $R -path '*mipmap-*dpi*' -type f -name 'ic_launcher*' ! -path '*anydpi*'); do
              case "$f" in
                *foreground*) convert "$ICON" -resize 130x130 -background none -gravity center -extent 192x192 "$f" || true ;;
                *) convert "$ICON" -resize 192x192 "$f" || true ;;
              esac
            done
          fi
      - name: Build APK
        working-directory: src/V2rayNG
        run: |
          chmod +x gradlew
          OPTS="-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
          ./gradlew assembleDebug $OPTS || ./gradlew assembleDebug --refresh-dependencies $OPTS || ./gradlew assembleDebug --refresh-dependencies $OPTS
      - name: Keep only the small APK
        run: |
          mkdir out
          A=$(find src/V2rayNG/app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          if [ -n "$A" ]; then cp "$A" out/GameVPN-small.apk; else cp $(find src/V2rayNG/app/build/outputs/apk -name '*.apk' | head -1) out/GameVPN-small.apk; fi
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: GameVPN-small
          path: out/GameVPN-small.apk
