name: Build GameVPN Real
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: mine
      - uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          submodules: recursive
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download core library
        run: |
          mkdir -p src/V2rayNG/app/libs
          gh release download -R 2dust/AndroidLibXrayLite -p "libv2ray.aar" -D src/V2rayNG/app/libs
      - name: Rebrand
        run: |
          R=src/V2rayNG/app/src/main/res
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">GameVPN</string>|' $R/values/strings.xml
          for f in $R/values-*/strings.xml; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">GameVPN</string>|' "$f"
          done
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install -q --break-system-packages pillow || true
          python3 - << 'PY'
          import glob, sys
          try:
              from PIL import Image
          except Exception:
              print('pillow not available, skipping icon')
              sys.exit(0)
          icons = sorted(glob.glob('mine/*.png'))
          if icons:
              src = Image.open(icons[0]).convert('RGBA')
              R = 'src/V2rayNG/app/src/main/res'
              for f in glob.glob(R + '/mipmap-*dpi*/ic_launcher*'):
                  if 'anydpi' in f:
                      continue
                  try:
                      if 'foreground' in f:
                          im = src.resize((130, 130))
                          c = Image.new('RGBA', (192, 192), (0, 0, 0, 0))
                          c.paste(im, (31, 31), im)
                      else:
                          c = src.resize((192, 192))
                      c.save(f)
                  except Exception as e:
                      print('skip', f, e)
          PY
      - name: Build APK
        working-directory: src/V2rayNG
        run: |
          chmod +x gradlew
          OPTS="-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
          ./gradlew assembleDebug $OPTS || ./gradlew assembleDebug --refresh-dependencies $OPTS || ./gradlew assembleDebug --refresh-dependencies $OPTS
      - uses: actions/upload-artifact@v4
        with:
          name: GameVPN-small
          path: src/V2rayNG/app/build/outputs/apk/**/*arm64-v8a*.apk
